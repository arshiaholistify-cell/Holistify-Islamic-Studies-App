name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject environment variables
        run: |
          set -e
          # Strip any stray whitespace/newlines that copy-pasted secrets can pick up
          CLEAN_URL="$(printf '%s' "$ISLAMIC_STUDIES_SUPABASE_URL" | tr -d '\n\r' | xargs)"
          CLEAN_KEY="$(printf '%s' "$ISLAMIC_STUDIES_SUPABASE_ANON_KEY" | tr -d '\n\r' | xargs)"
          sed -i "s|__IS_SUPABASE_URL__|${CLEAN_URL}|g" index.html
          sed -i "s|__IS_SUPABASE_ANON_KEY__|${CLEAN_KEY}|g" index.html
        env:
          ISLAMIC_STUDIES_SUPABASE_URL: ${{ secrets.ISLAMIC_STUDIES_SUPABASE_URL }}
          ISLAMIC_STUDIES_SUPABASE_ANON_KEY: ${{ secrets.ISLAMIC_STUDIES_SUPABASE_ANON_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
